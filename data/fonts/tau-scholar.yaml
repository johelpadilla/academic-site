# Tau Scholar — classic academic, less “display font”
# Source Serif for headings; Source Sans for body.

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Tau Scholar"
    vendor: "johelpadilla"
    version: "1.1.0"
    license: "MIT"
    style: "mixed"
    description: "Source Serif 4 + Source Sans 3 — quiet scholarly pairing"

  families:
    heading: "Source Serif 4"
    body: "Source Sans 3"
    code: "JetBrains Mono"

  weights:
    heading: [500, 600, 700]
    body: [400, 500, 600, 700]
    code: [400, 500]

  leading:
    heading: 1.2
    body: 1.7
    code: 1.5

  tracking:
    heading: "-0.015em"
    body: "0"

  variable:
    heading: true
    body: true
    code: true
