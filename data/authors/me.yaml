bio: |
  Investigador independiente y profesor universitario en salud ambiental, dinámica de enfermedades vectoriales y marcos teóricos para sistemas complejos. Su tesis DrPH (UPR, 2022) examinó la dinámica espaciotemporal de *Aedes aegypti* en la zona del Caño Martín Peña, San Juan, Puerto Rico.

  El trabajo actual se centra en Systemic Tau (τ_s) y el Reloj Extramental Discreto (RECD): métricas ordinales, tiempo discreto anidado, dependencia de orden superior (excess³) y alerta temprana (dengue). Software abierto: Academy Learning Tau y Systemic Tau. Monografías: *Systemic Tau and the Discrete Architecture of Time* (2.ª ed.) y *El acto de ser relacional-discreto*, en diálogo con Leonardo Polo.

  Independent researcher and university professor in environmental health, vector-borne disease dynamics, and theoretical frameworks for complex systems. Current program: Systemic Tau (τ_s), RECD, excess³ / Φ₃, open educational software, and monographs in philosophy of physics.

