# Tau Nexus — restrained academic palette
# One calm primary; secondary close in hue (not copper/gold clash).

hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Tau Nexus"
    vendor: "johelpadilla"
    version: "1.1.0"
    license: "MIT"
    description: "Quiet ink and blue — academic, not marketing"

  type: "dual"

  light:
    colors:
      primary: "#1e3a5f"   # deep academic blue-ink
      secondary: "#475569" # slate-600 — supporting, not competing
      neutral: "slate"
    surfaces:
      background: "#fafaf9" # near-white warm
      foreground: "#0f172a"
      header:
        background: "rgba(250, 250, 249, 0.92)"
        foreground: "#0f172a"
      footer:
        background: "#f1f5f9"
        foreground: "#334155"

  dark:
    colors:
      primary: "#93c5fd"   # soft blue
      secondary: "#94a3b8" # muted slate
      neutral: "slate"
    surfaces:
      background: "#0c111b"
      foreground: "#e8eef7"
      header:
        background: "rgba(12, 17, 27, 0.9)"
        foreground: "#f8fafc"
      footer:
        background: "#080c14"
        foreground: "#94a3b8"
